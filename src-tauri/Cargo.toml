[package]
name = "crowdrelay-mobile"
version = "0.2.0"
description = "Virya fan wallet and live operations client for CrowdRelay"
authors = ["Wojciech Bator"]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[lib]
name = "crowdrelay_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crowdrelay-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
