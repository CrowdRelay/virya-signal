[package]
name = "crowdrelay-mobile"
version = "0.4.2"
description = "Virya fan wallet and live operations client for CrowdRelay"
authors = ["Wojciech Bator"]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"

[lib]
name = "crowdrelay_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "crowdrelay-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["gzip", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rand = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri = { version = "2.11.5", features = [] }
iota_stronghold = "2.1.0"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["rt", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "0.26"
