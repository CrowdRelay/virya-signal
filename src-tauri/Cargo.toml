[package]
name = "virya-signal"
version = "0.5.1"
description = "Virya Signal mobile fan wallet and live operations client"
authors = ["Wojciech Bator"]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[lib]
name = "virya_signal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "virya-signal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
virya-signal-contracts = { path = "../crates/virya-signal-contracts" }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
argon2 = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri = { version = "2.11.5", features = [] }
iota_stronghold = "2.1.0"
tauri-plugin-opener = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"
tauri-plugin-geolocation = "2.3.2"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"
