<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc107"/>
      <stop offset=".55" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0a0a0a"/>
  <g id="signal-bars" fill="url(#amber)" filter="url(#glow)">
    <rect x="302" y="470" width="60" height="180" rx="30"/>
    <rect x="392" y="390" width="60" height="260" rx="30"/>
    <rect x="482" y="282" width="60" height="460" rx="30"/>
    <rect x="572" y="350" width="60" height="310" rx="30"/>
    <rect x="662" y="430" width="60" height="230" rx="30"/>
  </g>
</svg>
