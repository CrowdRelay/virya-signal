<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc107"/>
      <stop offset=".55" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0a0a0a"/>
  <g id="signal-bars" fill="url(#amber)" filter="url(#glow)">
    <rect x="370" y="430" width="56" height="190" rx="28"/>
    <rect x="484" y="290" width="56" height="440" rx="28"/>
    <rect x="598" y="370" width="56" height="280" rx="28"/>
  </g>
</svg>
