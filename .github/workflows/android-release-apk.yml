name: Android Signed APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.4.2
        required: true
        default: 0.4.2
  push:
    tags:
      - "apk-v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: android-signed-apk
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/apk-v* ]]; then
            version="${GITHUB_REF_NAME#apk-v}"
          else
            version="$DISPATCH_VERSION"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=virya-signal-android-signed-$version" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: release-apk
      version: ${{ needs.meta.outputs.version }}
      artifact_name: ${{ needs.meta.outputs.artifact_name }}
      retention_days: 90
      signed: true
    secrets: inherit

  github-release:
    if: startsWith(github.ref, 'refs/tags/apk-v')
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.meta.outputs.artifact_name }}
          path: promoted
      - name: Verify exact build artifact
        run: |
          set -euo pipefail
          python3 promoted/scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
          test -f "promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.apk"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.apk
          CHECKSUM: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.apk.sha256
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi

      - name: Report Virya Signal release to CrowdRelay ledger
        continue-on-error: true
        env:
          CROWDRELAY_BASE_URL: ${{ vars.CROWDRELAY_PRODUCTION_BASE_URL }}
          CROWDRELAY_COMMERCE_API_KEY: ${{ secrets.CROWDRELAY_COMMERCE_API_KEY }}
          COMPONENT_VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROWDRELAY_BASE_URL:-}" || -z "${CROWDRELAY_COMMERCE_API_KEY:-}" ]]; then
            echo "VIRYA_SIGNAL_RELEASE_LEDGER=SKIP reason=not-configured"
            exit 0
          fi
          lock_sha="$(jq -r '.dependencyLockSha256' promoted/release-provenance.json)"
          manifest_sha="$(jq -r '.artifactManifestSha256' promoted/release-provenance.json)"
          [[ "${lock_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${manifest_sha}" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_RUN_ID}" --arg version "${COMPONENT_VERSION}" --arg lock "${lock_sha}" --arg artifact_manifest "${manifest_sha}" '{component_key:"virya-signal",environment:"production",source_sha:$sha,artifact_digest:("sha256:"+$artifact_manifest),deploy_ref:$ref,version:$version,manifest_sha:null,metadata:{reporter:"github-actions",dependency_lock_sha256:$lock,artifact_manifest_sha256:$artifact_manifest},observed_at:(now|todateiso8601)}' | \
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${CROWDRELAY_COMMERCE_API_KEY}" \
              --data-binary @- "${CROWDRELAY_BASE_URL%/}/v1/internal/autopilot/release-components"
          echo "VIRYA_SIGNAL_RELEASE_LEDGER=PASS sha=${GITHUB_SHA} version=${COMPONENT_VERSION}"
