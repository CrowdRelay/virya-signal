name: Android Signed APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.2.0
        required: true
        default: 0.2.0
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

concurrency:
  group: android-signed-apk
  cancel-in-progress: false

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  NDK_VERSION: "27.2.12479018"
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/apk-v') && github.ref_name || inputs.version }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri tools
        run: |
          cargo install trunk --version 0.21.14 --locked
          cargo install tauri-cli --version '^2' --locked
      - name: Set release version
        run: python3 scripts/set-release-version.py "${RELEASE_VERSION#apk-v}" --android-version-code "$GITHUB_RUN_NUMBER"
      - name: Generate Android project
        run: cargo tauri android init --ci --skip-targets-install
      - name: Generate mobile icons
        run: cargo tauri icon src-tauri/icons/icon.png --ios-color "#080808"
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/virya-upload.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/virya-upload.jks
          EOF
          python3 scripts/prepare-android.py --signing
      - name: Build signed APK
        run: cargo tauri android build --ci --apk
      - name: Collect APK
        run: |
          mkdir -p artifacts
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "artifacts/virya-${RELEASE_VERSION#apk-v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: virya-android-signed-${{ env.RELEASE_VERSION }}
          path: artifacts/*.apk
          retention-days: 90
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/apk-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
