name: Android Signed APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.4.2
        required: true
        default: 0.4.2
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

concurrency:
  group: android-signed-apk
  cancel-in-progress: false

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  NDK_VERSION: "27.2.12479018"
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/apk-v') && github.ref_name || inputs.version }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6.2.0
      - name: Install Android SDK and NDK
        run: scripts/install-android-sdk.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown,aarch64-linux-android
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: android-arm64
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-0.21.14-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Tauri tools
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.4
      - name: Set release version
        run: python3 scripts/set-release-version.py "${RELEASE_VERSION#apk-v}" --android-version-code auto
      - name: Generate Android project
        run: cargo tauri android init --ci --skip-targets-install
      - name: Generate mobile icons
        run: cargo tauri icon src-tauri/icons/icon.png --ios-color "#080808"
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/configure-android-signing.py "$RUNNER_TEMP/virya-upload.jks" src-tauri/gen/android/keystore.properties
          python3 scripts/prepare-android.py --signing
      - name: Build signed APK
        run: cargo tauri android build --ci --apk --target aarch64
      - name: Capture Android dependency graph
        run: |
          mkdir -p artifacts
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:dependencies --configuration releaseRuntimeClasspath > artifacts/android-release-dependencies.txt
      - name: Collect APK
        run: python3 scripts/collect-mobile-artifact.py apk "artifacts/virya-signal-${RELEASE_VERSION#apk-v}.apk" --max-size-mib 100
      - name: Inspect APK size and ABI
        run: |
          python3 scripts/analyze-android-package.py "artifacts/virya-signal-${RELEASE_VERSION#apk-v}.apk" --require-abi arm64-v8a --require-page-size 16384
          zipalign -c -P 16 -v 4 "artifacts/virya-signal-${RELEASE_VERSION#apk-v}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: virya-signal-android-signed-${{ env.RELEASE_VERSION }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/apk-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
