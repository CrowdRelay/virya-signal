name: Android Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.4.2
        required: true
        default: 0.4.2
      play_track:
        description: Google Play track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-google-play
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: release-aab
      version: ${{ inputs.version }}
      artifact_name: virya-signal-google-play-${{ inputs.version }}
      retention_days: 90
      signed: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.play_track == 'production' && 'production' || 'store-testing' }}
    steps:
      - name: Validate Google Play secret
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$PLAY_JSON" || { echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: virya-signal-google-play-${{ inputs.version }}
          path: promoted
      - name: Verify exact build artifact
        run: |
          set -euo pipefail
          python3 promoted/scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
          test -f "promoted/artifacts/virya-signal-${{ inputs.version }}.aab"
      - name: Upload exact AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: music.virya.control
          releaseFiles: promoted/artifacts/virya-signal-${{ inputs.version }}.aab
          track: ${{ inputs.play_track }}
          status: completed
