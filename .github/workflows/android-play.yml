name: Android Google Play

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.4.2
        required: true
        default: 0.4.2
      play_track:
        description: Google Play track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      reuse_run_id:
        description: Optional previous Android Google Play workflow run ID to reuse an already-built AAB for this exact commit/version
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: android-google-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Wait for the exact main Check run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "PLAY_GATE=PASS mode=manual sha=${GITHUB_SHA}"
            exit 0
          fi

          echo "Waiting for Check on exact source SHA ${GITHUB_SHA}"
          for attempt in $(seq 1 120); do
            row="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow check.yml \
              --commit "${GITHUB_SHA}" \
              --limit 1 \
              --json databaseId,status,conclusion,headSha \
              --jq '.[0] // empty' 2>/dev/null || true)"

            if [[ -z "${row}" ]]; then
              sleep 15
              continue
            fi

            head_sha="$(jq -r '.headSha // empty' <<<"${row}")"
            status="$(jq -r '.status // empty' <<<"${row}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${row}")"
            run_id="$(jq -r '.databaseId // empty' <<<"${row}")"
            [[ "${head_sha}" == "${GITHUB_SHA}" ]]

            if [[ "${status}" != "completed" ]]; then
              echo "PLAY_GATE=WAIT check_run=${run_id} status=${status} attempt=${attempt}"
              sleep 15
              continue
            fi

            case "${conclusion}" in
              success)
                echo "should_publish=true" >> "$GITHUB_OUTPUT"
                echo "PLAY_GATE=PASS check_run=${run_id} sha=${GITHUB_SHA}"
                exit 0
                ;;
              cancelled)
                echo "should_publish=false" >> "$GITHUB_OUTPUT"
                echo "PLAY_GATE=SKIP reason=superseded check_run=${run_id} sha=${GITHUB_SHA}"
                exit 0
                ;;
              *)
                echo "PLAY_GATE=FAIL check_run=${run_id} conclusion=${conclusion} sha=${GITHUB_SHA}" >&2
                exit 1
                ;;
            esac
          done

          echo "PLAY_GATE=FAIL reason=check-timeout sha=${GITHUB_SHA}" >&2
          exit 1

  prepare:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      play_track: ${{ steps.release.outputs.play_track }}
      reuse_run_id: ${{ steps.release.outputs.reuse_run_id }}
      android_version_code: ${{ steps.release.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v7.0.1
      - name: Resolve release request
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TRACK: ${{ inputs.play_track }}
          INPUT_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="$(jq -r '.version' src-tauri/tauri.conf.json)"
            play_track="internal"
            reuse_run_id=""
          else
            version="${INPUT_VERSION}"
            play_track="${INPUT_TRACK}"
            reuse_run_id="${INPUT_REUSE_RUN_ID}"
          fi

          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          case "${play_track}" in internal|alpha|beta|production) ;; *) exit 2 ;; esac
          if [[ -n "${reuse_run_id}" ]]; then
            [[ "${reuse_run_id}" =~ ^[0-9]+$ ]]
          fi

          # Google Play requires every uploaded AAB to carry a fresh versionCode.
          # Keep versionName human-readable (e.g. 0.4.2) and reserve a high,
          # monotonically increasing CI range for this workflow only.
          android_version_code=$((100000000 + GITHUB_RUN_NUMBER))
          (( android_version_code >= 1 && android_version_code <= 2100000000 ))

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "play_track=${play_track}" >> "$GITHUB_OUTPUT"
          echo "reuse_run_id=${reuse_run_id}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${android_version_code}" >> "$GITHUB_OUTPUT"
          echo "PLAY_RELEASE_REQUEST=PASS version=${version} versionCode=${android_version_code} track=${play_track} sha=${GITHUB_SHA}"

  build:
    needs: [gate, prepare]
    if: needs.gate.outputs.should_publish == 'true' && needs.prepare.outputs.reuse_run_id == ''
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: release-aab
      version: ${{ needs.prepare.outputs.version }}
      android_version_code: ${{ needs.prepare.outputs.android_version_code }}
      artifact_name: virya-signal-google-play-${{ needs.prepare.outputs.version }}
      retention_days: 90
      signed: true
    secrets: inherit

  publish:
    needs: [gate, prepare, build]
    if: >-
      ${{ always() &&
          needs.gate.outputs.should_publish == 'true' &&
          needs.prepare.result == 'success' &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ needs.prepare.outputs.play_track == 'production' && 'production' || 'store-testing' }}
    steps:
      - name: Validate Google Play secret
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PLAY_JSON}" || { echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2; exit 1; }
          jq -e '.type == "service_account" and (.client_email | type == "string") and (.private_key | type == "string")' <<<"${PLAY_JSON}" >/dev/null
          echo "GOOGLE_PLAY_CREDENTIALS=PASS"
      - name: Refuse production promotion from a non-main ref
        if: needs.prepare.outputs.play_track == 'production'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
      - name: Download AAB built in this run
        if: needs.prepare.outputs.reuse_run_id == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: virya-signal-google-play-${{ needs.prepare.outputs.version }}
          path: promoted
      - name: Reuse exact AAB from an earlier run
        if: needs.prepare.outputs.reuse_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: virya-signal-google-play-${{ needs.prepare.outputs.version }}
          path: promoted
          run-id: ${{ needs.prepare.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact build artifact
        run: |
          set -euo pipefail
          python3 promoted/scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
          test -s promoted/release-provenance.json
          test -f "promoted/artifacts/virya-signal-${{ needs.prepare.outputs.version }}.aab"
          jq -e '.firebaseConfigured == true and .analyticsIncluded == false and .crashlyticsIncluded == false' promoted/artifacts/push-build-config.json >/dev/null
          jq -e '.push.firebaseConfigured == true and (.push.firebaseConfigSha256 | test("^[0-9a-f]{64}$"))' promoted/release-provenance.json >/dev/null
          echo "PLAY_ARTIFACT=PASS sha=${GITHUB_SHA} version=${{ needs.prepare.outputs.version }} versionCode=${{ needs.prepare.outputs.android_version_code }}"
      - name: Upload exact AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: music.virya.signal
          releaseFiles: promoted/artifacts/virya-signal-${{ needs.prepare.outputs.version }}.aab
          track: ${{ needs.prepare.outputs.play_track }}
          status: completed
          releaseName: Virya Signal ${{ needs.prepare.outputs.version }} · CI ${{ github.run_number }}
      - name: Publish receipt
        shell: bash
        run: |
          echo "GOOGLE_PLAY_UPLOAD=PASS package=music.virya.signal track=${{ needs.prepare.outputs.play_track }} version=${{ needs.prepare.outputs.version }} versionCode=${{ needs.prepare.outputs.android_version_code }} sha=${GITHUB_SHA}"
      - name: Report production Virya Signal release to CrowdRelay ledger
        if: needs.prepare.outputs.play_track == 'production'
        continue-on-error: true
        env:
          CROWDRELAY_BASE_URL: ${{ vars.CROWDRELAY_PRODUCTION_BASE_URL }}
          CROWDRELAY_COMMERCE_API_KEY: ${{ secrets.CROWDRELAY_COMMERCE_API_KEY }}
          COMPONENT_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROWDRELAY_BASE_URL:-}" || -z "${CROWDRELAY_COMMERCE_API_KEY:-}" ]]; then
            echo "VIRYA_SIGNAL_RELEASE_LEDGER=SKIP reason=not-configured"
            exit 0
          fi
          lock_sha="$(jq -r '.dependencyLockSha256' promoted/release-provenance.json)"
          manifest_sha="$(jq -r '.artifactManifestSha256' promoted/release-provenance.json)"
          [[ "${lock_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${manifest_sha}" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_RUN_ID}" --arg version "${COMPONENT_VERSION}" --arg lock "${lock_sha}" --arg artifact_manifest "${manifest_sha}" '{component_key:"virya-signal",environment:"production",source_sha:$sha,artifact_digest:("sha256:"+$artifact_manifest),deploy_ref:$ref,version:$version,manifest_sha:null,metadata:{reporter:"github-actions",channel:"google-play-production",dependency_lock_sha256:$lock,artifact_manifest_sha256:$artifact_manifest,push_firebase_configured:true},observed_at:(now|todateiso8601)}' | \
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${CROWDRELAY_COMMERCE_API_KEY}" \
              --data-binary @- "${CROWDRELAY_BASE_URL%/}/v1/internal/autopilot/release-components"
          echo "VIRYA_SIGNAL_RELEASE_LEDGER=PASS sha=${GITHUB_SHA} version=${COMPONENT_VERSION} channel=google-play-production"
