name: Tenant App Build

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: Tenant slug (e.g. virya, future-metal)
        required: true
      version:
        description: App version (e.g. 0.5.1)
        required: true
      version_code:
        description: Android versionCode (positive integer)
        required: true
      publish:
        description: Upload AAB to Google Play after build
        required: false
        type: boolean
        default: false
      play_track:
        description: Google Play track (if publishing)
        required: false
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

permissions:
  contents: read

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: tenant-app-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve tenant-specific secret names
        id: tenant-secrets
        env:
          TENANT_SLUG: ${{ inputs.tenant_slug }}
        shell: bash
        run: |
          set -euo pipefail
          upper="$(echo "$TENANT_SLUG" | tr '[:lower:]-' '[:upper:]_')"
          echo "firebase_secret=TENANT_${upper}_GOOGLE_SERVICES_B64" >> "$GITHUB_OUTPUT"
          echo "keystore_secret=TENANT_${upper}_KEYSTORE_BASE64" >> "$GITHUB_OUTPUT"
          echo "key_alias_secret=TENANT_${upper}_KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "key_password_secret=TENANT_${upper}_KEY_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "TENANT_SECRET_RESOLVE=PASS tenant=$TENANT_SLUG upper=$upper"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Trunk
        uses: jetli/trunk-action@69821d4eec12c308c4b811e459e37556cf920057 # v0.5.0
        with:
          version: "latest"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;${{ env.NDK_VERSION }}

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Fetch tenant config and build AAB
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.CONTROL_PLANE_ADMIN_TOKEN }}
          TENANT_SLUG: ${{ inputs.tenant_slug }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          PUBLISH: ${{ inputs.publish }}
          # Per-tenant secrets — resolved dynamically by name
          ANDROID_KEYSTORE_BASE64: ${{ secrets[steps.tenant-secrets.outputs.keystore_secret] }}
          ANDROID_KEY_ALIAS: ${{ secrets[steps.tenant-secrets.outputs.key_alias_secret] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[steps.tenant-secrets.outputs.key_password_secret] }}
          VIRYA_SIGNAL_GOOGLE_SERVICES_JSON_B64: ${{ secrets[steps.tenant-secrets.outputs.firebase_secret] }}
        run: |
          set -euo pipefail
          bash scripts/build-tenant-app.sh \
            --tenant "$TENANT_SLUG" \
            --control-plane-url "$CONTROL_PLANE_URL" \
            --token "$CONTROL_PLANE_ADMIN_TOKEN" \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            $([[ "$PUBLISH" == "true" ]] && echo "--publish")

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.tenant_slug }}-signal-${{ inputs.version }}
          path: build/tenant-apps/${{ inputs.tenant_slug }}-signal-${{ inputs.version }}.aab
          retention-days: 14

      - name: Auto-populate Play Store URL in control plane
        if: inputs.publish == true
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_ADMIN_TOKEN: ${{ secrets.CONTROL_PLANE_ADMIN_TOKEN }}
          TENANT_SLUG: ${{ inputs.tenant_slug }}
        shell: bash
        run: |
          set -euo pipefail
          package_id="music.${TENANT_SLUG}.signal"
          play_url="https://play.google.com/store/apps/details?id=${package_id}"
          curl --fail-with-body --silent --show-error --max-time 15 \
            -X PATCH \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer ${CONTROL_PLANE_ADMIN_TOKEN}" \
            -d "{\"signalPlayStoreUrl\":\"${play_url}\"}" \
            "${CONTROL_PLANE_URL%/}/api/v1/tenants/${TENANT_SLUG}/mobile-apps"
          echo "PLAY_STORE_URL_UPDATE=PASS tenant=${TENANT_SLUG} url=${play_url}"
