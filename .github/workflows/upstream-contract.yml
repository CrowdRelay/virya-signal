name: Upstream contract

on:
  workflow_dispatch:
  schedule:
    - cron: "29 */6 * * *"
  push:
    branches: [main]
    paths:
      - "crates/virya-signal-contracts/**"
      - "src-tauri/src/api/**"
      - "src-tauri/src/models/**"
      - "scripts/generate-crowdrelay-fan-contract.py"
      - ".github/workflows/upstream-contract.yml"
  pull_request:
    paths:
      - "crates/virya-signal-contracts/**"
      - "src-tauri/src/api/**"
      - "src-tauri/src/models/**"
      - "scripts/generate-crowdrelay-fan-contract.py"
      - ".github/workflows/upstream-contract.yml"

permissions:
  contents: read

concurrency:
  group: signal-upstream-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crowdrelay:
    name: CrowdRelay compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Signal under canonical ecosystem layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: virya-signal

      - name: Check out current CrowdRelay main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/crowdrelay
          ref: main
          path: crowdrelay
          persist-credentials: false
          token: ${{ secrets.CROWDRELAY_PAT }}

      - name: Verify Signal against current upstream capabilities and schema
        id: contract
        run: python3 crowdrelay/scripts/test-ecosystem-contract-v2.py

      # If the scheduled/polling check detects drift, trigger the
      # contract-propagate workflow to auto-regenerate and open a PR.
      # This only runs on the default branch (not on PRs — a PR failing
      # the contract test is the developer's signal to fix it manually).
      - name: Trigger auto-regeneration on drift
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPENAPI_SHA="$(sha256sum crowdrelay/openapi/openapi.yaml | awk '{print $1}')"
          echo "Contract drift detected on polling check — triggering contract-propagate"
          gh workflow run contract-propagate.yml \
            -f openapi_sha="$OPENAPI_SHA" \
            || echo "WARN: could not trigger contract-propagate workflow"
