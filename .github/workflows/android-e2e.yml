name: Android E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e2e:
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: debug-apk
      version: 0.4.2-e2e
      artifact_name: virya-signal-android-e2e
      retention_days: 7
      signed: false
      target_arch: x86_64
      e2e_api_base: http://10.0.2.2:8787/v1/
    # Manual E2E may use the repository Firebase config even though the APK is
    # debug/unsigned. This lets the emulator prove default-app initialization
    # without exposing or logging the config.
    secrets: inherit

  journeys:
    needs: build-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_API: "35"
      AVD_NAME: virya-signal-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: virya-signal-android-e2e
          path: artifacts/build
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v7.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v7.0.1
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ env.ANDROID_API }}/google_apis/x86_64
          key: android-system-image-${{ runner.os }}-android${{ env.ANDROID_API }}-google_apis-x86_64
      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-${ANDROID_API}" \
            "system-images;android-${ANDROID_API};google_apis;x86_64"
          echo no | avdmanager create avd \
            --force \
            --name "${AVD_NAME}" \
            --package "system-images;android-${ANDROID_API};google_apis;x86_64" \
            --device "pixel_6"
      - name: Enable KVM for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-24.04 runners expose /dev/kvm but do not grant the runner
          # user access to it. Without KVM the x86_64 emulator either refuses to
          # start or falls back to software emulation that never finishes
          # booting, which is what turned this job into a silent multi-minute
          # hang rather than a failure.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable; the emulator cannot be accelerated" >&2; exit 1; }
          echo "ANDROID_E2E_KVM=PASS"
      - name: Boot clean Android emulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-e2e
          nohup emulator -avd "${AVD_NAME}" \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -accel on -gpu swiftshader \
            > artifacts/android-e2e/emulator.log 2>&1 &
          emulator_pid=$!

          # Every wait below is bounded and checks that the emulator is still
          # alive. An unbounded `adb wait-for-device` turns any startup failure
          # into a hang that burns the whole job timeout with no output.
          fail() {
            echo "::error::${1}"
            echo "----- emulator.log (last 200 lines) -----"
            tail -n 200 artifacts/android-e2e/emulator.log 2>/dev/null || echo "(no emulator log)"
            echo "----- adb devices -----"
            adb devices -l 2>&1 || true
            exit 1
          }

          attached=0
          for _ in $(seq 1 60); do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              fail "emulator process exited during startup"
            fi
            if timeout 5 adb wait-for-device >/dev/null 2>&1; then
              attached=1
              break
            fi
          done
          [[ "${attached}" == "1" ]] || fail "no emulator device attached within 5 minutes"

          booted=0
          for _ in $(seq 1 120); do
            if ! kill -0 "${emulator_pid}" 2>/dev/null; then
              fail "emulator process exited before boot completed"
            fi
            if [[ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 2
          done
          [[ "${booted}" == "1" ]] || fail "sys.boot_completed never became 1"
          echo "ANDROID_E2E_EMULATOR=PASS boot=completed"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb logcat -c
      - name: Start isolated CrowdRelay double
        shell: bash
        run: |
          set -euo pipefail
          OFFLINE_FILE="${RUNNER_TEMP}/signal-e2e-offline"
          rm -f "${OFFLINE_FILE}"
          nohup python3 scripts/e2e/mock_signal_api.py \
            --port 8787 --offline-file "${OFFLINE_FILE}" \
            > artifacts/android-e2e/mock-api.log 2>&1 &
          echo "OFFLINE_FILE=${OFFLINE_FILE}" >> "${GITHUB_ENV}"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/healthz >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/android-e2e/mock-api.log
          exit 1
      - name: Install E2E APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find artifacts/build -type f -name '*.apk' -print -quit)"
          test -n "${APK}"
          adb install -r -t "${APK}"
          adb shell pm list packages | grep -F 'package:music.virya.signal'
      - name: Run black-box journeys
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/e2e/android_journeys.py \
            --offline-file "${OFFLINE_FILE}" \
            --artifacts artifacts/android-e2e
      - name: Native crash / ANR gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-e2e
          # This step runs under `if: always()`. If boot failed there may be no
          # emulator at all; never let an unbounded adb call hide the original
          # failure or burn the remaining job timeout.
          if ! timeout 15 adb get-state >/dev/null 2>&1; then
            echo 'VIRYA_SIGNAL_ANDROID_CRASH_GATE=SKIP reason=no-device'
            exit 0
          fi
          if ! timeout 20 adb logcat -d > artifacts/android-e2e/logcat-final.txt; then
            echo 'VIRYA_SIGNAL_ANDROID_CRASH_GATE=FAIL reason=logcat-timeout' >&2
            exit 1
          fi
          if grep -E 'FATAL EXCEPTION|ANR in music\.virya\.signal|Render process gone' artifacts/android-e2e/logcat-final.txt; then
            echo 'VIRYA_SIGNAL_ANDROID_CRASH_GATE=FAIL' >&2
            exit 1
          fi
          echo 'VIRYA_SIGNAL_ANDROID_CRASH_GATE=PASS'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: virya-signal-android-e2e-report-${{ github.run_id }}
          path: artifacts/android-e2e
          if-no-files-found: warn
          retention-days: 14
