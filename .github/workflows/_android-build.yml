name: Reusable Android build

on:
  workflow_call:
    inputs:
      build_kind:
        description: debug-apk, release-apk, or release-aab
        required: true
        type: string
      version:
        description: Semantic release version without tag prefix
        required: true
        type: string
      artifact_name:
        description: GitHub artifact name
        required: true
        type: string
      retention_days:
        required: false
        type: number
        default: 14
      signed:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate build request and signing secrets
        env:
          BUILD_KIND: ${{ inputs.build_kind }}
          SIGNED: ${{ inputs.signed }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_CONFIG: ${{ secrets.VIRYA_SIGNAL_GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          case "${BUILD_KIND}" in debug-apk|release-apk|release-aab) ;; *) echo "Invalid build_kind: ${BUILD_KIND}" >&2; exit 2 ;; esac
          if [[ "${SIGNED}" == "true" ]]; then
            test -n "${KEYSTORE}" || { echo "Missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
            test -n "${ALIAS}" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
            test -n "${PASSWORD}" || { echo "Missing ANDROID_KEY_PASSWORD" >&2; exit 1; }
            test -n "${FIREBASE_CONFIG}" || { echo "Missing VIRYA_SIGNAL_GOOGLE_SERVICES_JSON_B64 for signed push-capable build" >&2; exit 1; }
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK and NDK
        run: scripts/install-android-sdk.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown,aarch64-linux-android
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: android-arm64
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-0.21.14-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Tauri tools
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.4
      - name: Set release version
        if: inputs.build_kind != 'debug-apk'
        run: python3 scripts/set-release-version.py "${{ inputs.version }}" --android-version-code auto
      - name: Generate Android project
        run: cargo tauri android init --ci --skip-targets-install
      - name: Prepare Android project
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VIRYA_SIGNAL_GOOGLE_SERVICES_JSON_B64: ${{ secrets.VIRYA_SIGNAL_GOOGLE_SERVICES_JSON_B64 }}
          SIGNED: ${{ inputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SIGNED}" == "true" ]]; then
            python3 scripts/configure-android-signing.py "$RUNNER_TEMP/virya-upload.jks" src-tauri/gen/android/keystore.properties
            python3 scripts/prepare-android.py --signing
          else
            python3 scripts/prepare-android.py
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = json.loads(Path("src-tauri/gen/android/push-build-config.json").read_text())
          if os.environ.get("SIGNED") == "true" and receipt.get("firebaseConfigured") is not True:
              raise SystemExit("signed Android build is missing Firebase configuration")
          print(f"SIGNAL_ANDROID_PUSH_BUILD_GATE=PASS firebase={str(bool(receipt.get('firebaseConfigured'))).lower()}")
          PY
      - name: Build Android package
        env:
          BUILD_KIND: ${{ inputs.build_kind }}
        shell: bash
        run: |
          set -euo pipefail
          case "${BUILD_KIND}" in
            debug-apk) cargo tauri android build --ci --debug --apk --target aarch64 ;;
            release-apk) cargo tauri android build --ci --apk --target aarch64 ;;
            release-aab) cargo tauri android build --ci --aab --target aarch64 ;;
          esac
      - name: Collect and inspect Android package
        env:
          BUILD_KIND: ${{ inputs.build_kind }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${BUILD_KIND}" == "release-aab" ]]; then
            ext=aab
            configuration=releaseRuntimeClasspath
            max_size=150
          elif [[ "${BUILD_KIND}" == "release-apk" ]]; then
            ext=apk
            configuration=releaseRuntimeClasspath
            max_size=100
          else
            ext=apk
            configuration=armDebugRuntimeClasspath
            max_size=150
          fi
          package="artifacts/virya-signal-${VERSION}.${ext}"
          python3 scripts/collect-mobile-artifact.py "${ext}" "${package}" --max-size-mib "${max_size}"
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:dependencies --configuration "${configuration}" > artifacts/android-dependencies.txt
          python3 scripts/analyze-android-package.py "${package}" --require-abi arm64-v8a --require-page-size 16384
          cp src-tauri/gen/android/push-build-config.json artifacts/push-build-config.json
          if [[ "${ext}" == "apk" ]]; then
            zipalign -c -P 16 -v 4 "${package}"
          fi
          python3 scripts/artifact_manifest.py create artifacts android-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 scripts/artifact_manifest.py verify artifacts android-artifact-manifest.json --source-sha "${GITHUB_SHA}"
          python3 scripts/write_release_provenance.py \
            --source-sha "${GITHUB_SHA}" \
            --lockfile Cargo.lock \
            --artifact-manifest android-artifact-manifest.json \
            --output release-provenance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            artifacts/*
            android-artifact-manifest.json
            release-provenance.json
            scripts/artifact_manifest.py
            scripts/write_release_provenance.py
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
