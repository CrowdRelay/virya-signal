# actions-recovery: 20260806-201024
name: Check

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enforce immutable CI policy
        run: |
          python3 scripts/check-ci-policy.py
          python3 scripts/source-size-ratchet.py
          python3 scripts/check-future-incompat.py
      - name: Static and release-tool contracts
        run: |
          python3 scripts/static-check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash -n scripts/*.sh
          node scripts/test-boot.mjs

  webassembly:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: wasm
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: trunk@0.21.14
      - name: Format and UI quality
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p virya-signal-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Release frontend and size budget
        run: |
          trunk build --release
          python3 scripts/check-web-dist.py dist
      - name: Record and compare Web performance metrics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/previous
          python3 scripts/web_metrics.py dist artifacts/web-metrics.json
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [[ -n "${previous_run}" ]]; then
            gh run download "${previous_run}" --repo "${GITHUB_REPOSITORY}" -n virya-signal-web-metrics -D artifacts/previous >/dev/null 2>&1 || true
          fi
          if [[ -s artifacts/previous/web-metrics.json ]]; then
            python3 scripts/compare_web_metrics.py artifacts/web-metrics.json artifacts/previous/web-metrics.json
          else
            echo "SIGNAL_WEB_REGRESSION=BASELINE_PENDING"
          fi
      - name: Upload Web performance baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virya-signal-web-metrics
          path: artifacts/web-metrics.json
          if-no-files-found: error
          retention-days: 90
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: native
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Native shell quality
        run: |
          cargo test --locked -p virya-signal
          cargo clippy --locked -p virya-signal --all-targets -- -D warnings
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
