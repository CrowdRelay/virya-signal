name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Normalize formatting
        run: cargo fmt --all --check
      - name: UI check
        run: cargo check -p virya-mobile-ui --target wasm32-unknown-unknown
      - name: Native shell check
        run: cargo check -p virya-mobile
      - name: Native tests
        run: cargo test -p virya-mobile
      - name: Clippy
        run: cargo clippy -p virya-mobile --all-targets -- -D warnings
      - name: Static contracts
        run: python3 scripts/static-check.py
