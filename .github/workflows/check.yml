# actions-recovery: 20260806-201024
name: Check

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fast policy contracts
        run: |
          python3 scripts/check-ci-policy.py
          python3 scripts/source-size-ratchet.py
      - name: Future-incompat dependency budget
        if: github.event_name != 'pull_request'
        run: python3 scripts/check-future-incompat.py
      - name: Static and release-tool contracts
        run: |
          python3 scripts/static-check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          # `unittest discover` imports this one and finds no TestCase in it,
          # so it counted as a passing file while never running: the module
          # limit it enforces had been breached for three files by the time
          # anyone ran it by hand. A script-style check has to be invoked.
          python3 scripts/test_source_modularity.py
          bash -n scripts/*.sh
          node scripts/test-boot.mjs
          # The critical CSS inlined in index.html is generated from styles.css
          # and nothing verified it, so it drifted silently: `.bottom-nav` and
          # `.content` had fallen out, and every cold start painted the shell
          # unstyled until the deferred stylesheet arrived. A generated file
          # with no check is a file that is wrong and does not say so.
          python3 scripts/extract-critical-css.py --check

  webassembly:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Purge stale sccache entries
        # sccache with GHA backend creates one cache entry per compilation
        # unit. Without pruning, thousands of content-hash-keyed entries
        # accumulate and exhaust the account-wide Actions storage quota.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("sccache/")) | .id' 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale sccache entries"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: wasm
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: trunk@0.21.14
      - name: Format
        run: cargo fmt --all --check
      - name: Release frontend and size budget
        run: |
          trunk build --release
          python3 scripts/check-web-dist.py dist
      - name: Purge stale artifacts before upload
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.created_at < (now - 7200 | strftime(\"%Y-%m-%dT%H:%M:%SZ\"))) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"
      - name: Upload release Web bundle for browser audits
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virya-signal-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 3
      - name: Release lint
        run: cargo clippy --locked --release -p virya-signal-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Record and compare Web performance metrics
        id: web_metrics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/previous
          python3 scripts/web_metrics.py dist artifacts/web-metrics.json
          test -s artifacts/web-metrics.json
          echo "generated=true" >> "$GITHUB_OUTPUT"
          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [[ -n "${previous_run}" ]]; then
            gh run download "${previous_run}" --repo "${GITHUB_REPOSITORY}" -n virya-signal-web-metrics -D artifacts/previous >/dev/null 2>&1 || true
          fi
          if [[ -s artifacts/previous/web-metrics.json ]]; then
            python3 scripts/compare_web_metrics.py artifacts/web-metrics.json artifacts/previous/web-metrics.json
          else
            echo "SIGNAL_WEB_REGRESSION=BASELINE_PENDING"
          fi
      - name: Upload Web performance baseline
        if: ${{ always() && steps.web_metrics.outputs.generated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virya-signal-web-metrics
          path: artifacts/web-metrics.json
          if-no-files-found: error
          retention-days: 3
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

  native:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Purge stale sccache entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("sccache/")) | .id' 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale sccache entries"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: native
      - name: Install Tauri Linux dependencies
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dpkg::Lock::Timeout=120 update -qq
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Native tests and lint
        run: |
          cargo test --locked -p virya-signal -p virya-signal-contracts
          cargo clippy --locked -p virya-signal -p virya-signal-contracts --all-targets -- -D warnings
      - name: Release-mode lint
        if: github.event_name != 'pull_request'
        run: cargo clippy --locked --release -p virya-signal -p virya-signal-contracts --all-targets -- -D warnings
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

