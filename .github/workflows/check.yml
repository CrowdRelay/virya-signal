name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "5"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: check
      - name: Normalize formatting
        run: cargo fmt --all --check
      - name: Static contracts
        run: python3 scripts/static-check.py
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: UI check
        run: cargo check --locked -p crowdrelay-mobile-ui --target wasm32-unknown-unknown
      - name: UI Clippy
        run: cargo clippy --locked -p crowdrelay-mobile-ui --target wasm32-unknown-unknown -- -D warnings
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Native shell check
        run: cargo check --locked -p crowdrelay-mobile
      - name: Native tests
        run: cargo test --locked -p crowdrelay-mobile
      - name: Clippy
        run: cargo clippy --locked -p crowdrelay-mobile --all-targets -- -D warnings
