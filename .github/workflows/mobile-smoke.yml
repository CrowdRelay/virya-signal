name: Android Smoke Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Trunk.toml"
      - "index.html"
      - "boot.js"
      - "boot-initializer.mjs"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/mobile-smoke.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Trunk.toml"
      - "index.html"
      - "boot.js"
      - "boot-initializer.mjs"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  NDK_VERSION: "27.2.12479018"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK and NDK
        run: scripts/install-android-sdk.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown,aarch64-linux-android
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: android-arm64
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-0.21.14-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Tauri tools
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.4
      - name: Generate Android project
        run: cargo tauri android init --ci --skip-targets-install
      - name: Generate mobile icons
        run: cargo tauri icon src-tauri/icons/icon.png --ios-color "#080808"
      - name: Target Android API 36
        run: python3 scripts/prepare-android.py
      - name: Build debug APK
        run: cargo tauri android build --ci --debug --apk --target aarch64
      - name: Capture Android dependency graph
        run: |
          mkdir -p artifacts
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:dependencies --configuration armDebugRuntimeClasspath > artifacts/android-debug-dependencies.txt
      - name: Collect APK
        run: python3 scripts/collect-mobile-artifact.py apk artifacts/virya-signal-debug.apk --max-size-mib 150
      - name: Inspect APK size and ABI
        run: |
          python3 scripts/analyze-android-package.py artifacts/virya-signal-debug.apk --require-abi arm64-v8a --require-page-size 16384
          zipalign -c -P 16 -v 4 artifacts/virya-signal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: virya-signal-android-debug
          path: |
            artifacts/virya-signal-debug.apk
            artifacts/virya-signal-debug.apk.sha256
            artifacts/android-debug-dependencies.txt
          if-no-files-found: error
          retention-days: 14
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
