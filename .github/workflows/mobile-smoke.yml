name: Android Smoke Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Trunk.toml"
      - "index.html"
      - "boot.js"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/_android-build.yml"
      - ".github/workflows/mobile-smoke.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Trunk.toml"
      - "index.html"
      - "boot.js"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/_android-build.yml"
      - ".github/workflows/mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: debug-apk
      version: debug
      artifact_name: virya-signal-android-debug
      retention_days: 14
      signed: false
    secrets: inherit
