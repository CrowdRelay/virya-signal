name: Android Smoke Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "index.html"
      - "boot.js"
      - "Trunk.toml"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/mobile-smoke.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "index.html"
      - "boot.js"
      - "Trunk.toml"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  NDK_VERSION: "27.2.12479018"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown,aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: android-smoke
      - name: Install pinned Tauri tools
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.4
      - name: Generate Android project
        run: cargo tauri android init --ci --skip-targets-install
      - name: Generate mobile icons
        run: cargo tauri icon src-tauri/icons/icon.png --ios-color "#080808"
      - name: Target Android API 36
        run: python3 scripts/prepare-android.py
      - name: Build debug APK
        run: cargo tauri android build --ci --debug --apk --target aarch64
      - name: Collect APK
        run: python3 scripts/collect-mobile-artifact.py apk artifacts/virya-signal-debug.apk --max-size-mib 150
      - uses: actions/upload-artifact@v7
        with:
          name: virya-signal-android-debug
          path: |
            artifacts/virya-signal-debug.apk
            artifacts/virya-signal-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
