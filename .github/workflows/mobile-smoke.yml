name: Android Smoke Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Trunk.toml"
      - "index.html"
      - "boot.js"
      - "boot-initializer.mjs"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/mobile-smoke.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Trunk.toml"
      - "index.html"
      - "boot.js"
      - "boot-initializer.mjs"
      - "styles.css"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  NDK_VERSION: "27.2.12479018"

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK and NDK
        run: scripts/install-android-sdk.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown,aarch64-linux-android
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: android-arm64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-0.21.14-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Tauri tools
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.4
      - name: Generate Android project
        run: cargo tauri android init --ci --skip-targets-install
      - name: Generate mobile icons
        run: cargo tauri icon src-tauri/icons/icon.png --ios-color "#080808"
      - name: Target Android API 36
        run: python3 scripts/prepare-android.py
      - name: Build debug APK
        run: cargo tauri android build --ci --debug --apk --target aarch64
      - name: Capture Android dependency graph
        run: |
          mkdir -p artifacts
          src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:dependencies --configuration armDebugRuntimeClasspath > artifacts/android-debug-dependencies.txt
      - name: Collect APK
        run: python3 scripts/collect-mobile-artifact.py apk artifacts/virya-signal-debug.apk --max-size-mib 150
      - name: Inspect APK size and ABI
        run: |
          python3 scripts/analyze-android-package.py artifacts/virya-signal-debug.apk --require-abi arm64-v8a --require-page-size 16384
          zipalign -c -P 16 -v 4 artifacts/virya-signal-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virya-signal-android-debug
          path: |
            artifacts/virya-signal-debug.apk
            artifacts/virya-signal-debug.apk.sha256
            artifacts/android-debug-dependencies.txt
          if-no-files-found: error
          retention-days: 14
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
