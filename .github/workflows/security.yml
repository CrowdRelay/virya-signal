name: Security Audit

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "src-tauri/Cargo.toml"
      - "security/future-incompat-budget.json"
      - "scripts/check-future-incompat.py"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - "src-tauri/Cargo.toml"
      - "security/future-incompat-budget.json"
      - "scripts/check-future-incompat.py"
      - ".github/workflows/security.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify repository-pinned Rust toolchain
        run: rustc --version --verbose
      - name: Enforce bounded future-incompatibility debt
        run: python3 scripts/check-future-incompat.py
      - name: Generate deterministic lock SBOM
        run: python3 scripts/generate_lock_sbom.py Cargo.lock artifacts/virya-signal-sbom.cdx.json
      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: virya-signal-sbom-${{ github.sha }}
          path: artifacts/virya-signal-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock
