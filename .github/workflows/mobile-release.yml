name: Mobile Store Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.4.2
        required: true
        default: 0.4.2
      target:
        description: Store target. Normal v* tags intentionally release Android only.
        required: true
        type: choice
        default: android
        options: [android, ios, all]
      play_track:
        description: Google Play track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      submit_ios_review:
        description: Submit the uploaded iOS build for App Review
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      android_artifact: ${{ steps.release.outputs.android_artifact }}
    steps:
      - id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "android_artifact=virya-signal-android-$version" >> "$GITHUB_OUTPUT"

  android-build:
    if: github.event_name == 'push' || inputs.target == 'android' || inputs.target == 'all'
    needs: meta
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: release-aab
      version: ${{ needs.meta.outputs.version }}
      artifact_name: ${{ needs.meta.outputs.android_artifact }}
      retention_days: 30
      signed: true
    secrets: inherit

  android-publish:
    name: Google Play promotion
    if: github.event_name == 'push' || inputs.target == 'android' || inputs.target == 'all'
    needs: [meta, android-build]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.play_track == 'production' && 'production' || 'store-testing' }}
    steps:
      - name: Validate Google Play secret
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$PLAY_JSON" || { echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.meta.outputs.android_artifact }}
          path: promoted
      - name: Verify exact Android build artifact
        run: |
          set -euo pipefail
          python3 promoted/scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
          test -f "promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab"
      - name: Upload exact AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: music.virya.control
          releaseFiles: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: completed
  ios:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'ios' || inputs.target == 'all')
    needs: meta
    name: iOS IPA and App Store Connect
    runs-on: macos-15
    timeout-minutes: 120
    environment:
      name: ${{ inputs.submit_ios_review && 'production' || 'store-testing' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Apple secrets
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$CERTIFICATE" || { echo "Missing IOS_CERTIFICATE"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$PROVISION" || { echo "Missing IOS_MOBILE_PROVISION"; exit 1; }
          test -n "$KEY_ID" || { echo "Missing APPLE_API_KEY_ID"; exit 1; }
          test -n "$ISSUER" || { echo "Missing APPLE_API_ISSUER"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "Missing APPLE_API_PRIVATE_KEY_BASE64"; exit 1; }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          cache-targets: false
          shared-key: ios-release
      - name: Install pinned Tauri tools
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: trunk@0.21.14,tauri-cli@2.11.4
      - name: Set release version
        run: python3 scripts/set-release-version.py "${{ needs.meta.outputs.version }}" --build-number "$GITHUB_RUN_NUMBER"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Generate iOS project
        run: cargo tauri ios init --ci --skip-targets-install
      - name: Generate mobile icons
        run: cargo tauri icon src-tauri/icons/icon.png --ios-color "#080808"
      - name: Build signed IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: cargo tauri ios build --ci --export-method app-store-connect
      - name: Collect IPA
        run: |
          python3 scripts/collect-mobile-artifact.py ipa "artifacts/virya-${{ needs.meta.outputs.version }}.ipa"
          echo "IPA_PATH=$GITHUB_WORKSPACE/artifacts/virya-${{ needs.meta.outputs.version }}.ipa" >> "$GITHUB_ENV"
      - name: Create iOS artifact provenance manifest
        run: |
          python3 scripts/artifact_manifest.py create artifacts ios-artifact-manifest.json --source-sha "$GITHUB_SHA"
          python3 scripts/artifact_manifest.py verify artifacts ios-artifact-manifest.json --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virya-ios-${{ needs.meta.outputs.version }}
          path: |
            artifacts/*
            ios-artifact-manifest.json
            scripts/artifact_manifest.py
          if-no-files-found: error
          retention-days: 30
      - name: Upload to TestFlight
        if: ${{ !inputs.submit_ios_review }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - name: Upload and submit for App Review
        if: ${{ inputs.submit_ios_review }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          gem install fastlane --no-document
          export APP_STORE_KEY_JSON="$RUNNER_TEMP/app-store-key.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "key_id": os.environ["APPLE_API_KEY_ID"],
              "issuer_id": os.environ["APPLE_API_ISSUER"],
              "key": Path(os.environ["APPLE_API_KEY_PATH"]).read_text(),
              "duration": 1200,
              "in_house": False,
          }
          Path(os.environ["APP_STORE_KEY_JSON"]).write_text(json.dumps(payload))
          PY
          fastlane deliver \
            --ipa "$IPA_PATH" \
            --api_key_path "$APP_STORE_KEY_JSON" \
            --submit_for_review \
            --automatic_release \
            --skip_metadata \
            --skip_screenshots \
            --force

  github-release:
    name: GitHub release artifacts
    if: startsWith(github.ref, 'refs/tags/v') && needs.android-build.result == 'success'
    needs: [meta, android-build, android-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.meta.outputs.android_artifact }}
          path: promoted
      - name: Verify Android release artifact
        run: |
          set -euo pipefail
          python3 promoted/scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AAB: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab
          CHECKSUM: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab.sha256
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$AAB" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$AAB" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
