name: Mobile Store Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.5.1
        required: true
        default: 0.5.1
      target:
        description: Store target. Normal v* tags release Android only.
        required: true
        type: choice
        default: android
        options: [android]
      play_track:
        description: Google Play track
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

permissions:
  contents: read
  actions: write

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      android_artifact: ${{ steps.release.outputs.android_artifact }}
      android_version_code: ${{ steps.release.outputs.android_version_code }}
    steps:
      - id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$DISPATCH_VERSION"
          fi
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "android_artifact=virya-signal-android-$version" >> "$GITHUB_OUTPUT"
          # Same monotonic scheme android-play.yml publishes with, so a tag-push
          # store release can never carry a lower code than an earlier main push.
          echo "android_version_code=$((100000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  android-build:
    if: github.event_name == 'push' || inputs.target == 'android' || inputs.target == 'all'
    needs: meta
    uses: ./.github/workflows/_android-build.yml
    with:
      build_kind: release-aab
      version: ${{ needs.meta.outputs.version }}
      android_version_code: ${{ needs.meta.outputs.android_version_code }}
      artifact_name: ${{ needs.meta.outputs.android_artifact }}
      retention_days: 3
      signed: true
    secrets: inherit

  android-publish:
    name: Google Play promotion
    if: github.event_name == 'push' || inputs.target == 'android' || inputs.target == 'all'
    needs: [meta, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.play_track == 'production' && 'production' || 'store-testing' }}
    steps:
      - name: Validate Google Play secret
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$PLAY_JSON" || { echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" >&2; exit 1; }
      - name: Refuse production promotion from a non-main ref
        if: ${{ (inputs.play_track || 'internal') == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
      # Checked out only so the artifact is verified by source-controlled code
      # rather than by the copy of the verifier that travels inside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: ${{ needs.meta.outputs.android_artifact }}
          path: promoted
      - name: Verify exact Android build artifact
        run: |
          set -euo pipefail
          python3 scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
          test -f "promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab"
          if [[ "${{ inputs.play_track || 'internal' }}" == "production" ]]; then
            jq -e '.firebaseConfigured == true and .analyticsIncluded == false and .crashlyticsIncluded == false' promoted/artifacts/push-build-config.json >/dev/null
          fi
      - name: Upload exact AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: music.virya.signal
          releaseFiles: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: completed
  github-release:
    name: GitHub release artifacts
    if: startsWith(github.ref, 'refs/tags/v') && needs.android-build.result == 'success'
    needs: [meta, android-build, android-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # Checked out only so the artifact is verified by source-controlled code
      # rather than by the copy of the verifier that travels inside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: ${{ needs.meta.outputs.android_artifact }}
          path: promoted
      - name: Verify Android release artifact
        run: |
          set -euo pipefail
          python3 scripts/artifact_manifest.py verify promoted/artifacts promoted/android-artifact-manifest.json --source-sha "$GITHUB_SHA"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AAB: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab
          CHECKSUM: promoted/artifacts/virya-signal-${{ needs.meta.outputs.version }}.aab.sha256
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$AAB" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$AAB" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi

      - name: Report Virya Signal release to CrowdRelay ledger
        continue-on-error: true
        env:
          CROWDRELAY_BASE_URL: ${{ secrets.CROWDRELAY_BASE_URL }}
          CROWDRELAY_COMMERCE_API_KEY: ${{ secrets.CROWDRELAY_COMMERCE_API_KEY }}
          COMPONENT_VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROWDRELAY_BASE_URL:-}" || -z "${CROWDRELAY_COMMERCE_API_KEY:-}" ]]; then
            echo "VIRYA_SIGNAL_RELEASE_LEDGER=SKIP reason=not-configured"
            exit 0
          fi
          lock_sha="$(jq -r '.dependencyLockSha256' promoted/release-provenance.json)"
          manifest_sha="$(jq -r '.artifactManifestSha256' promoted/release-provenance.json)"
          [[ "${lock_sha}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${manifest_sha}" =~ ^[0-9a-f]{64}$ ]]
          jq -n --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_RUN_ID}" --arg version "${COMPONENT_VERSION}" --arg lock "${lock_sha}" --arg artifact_manifest "${manifest_sha}" '{component_key:"virya-signal",environment:"production",source_sha:$sha,artifact_digest:("sha256:"+$artifact_manifest),deploy_ref:$ref,version:$version,manifest_sha:null,metadata:{reporter:"github-actions",dependency_lock_sha256:$lock,artifact_manifest_sha256:$artifact_manifest},observed_at:(now|todateiso8601)}' | \
            curl --fail-with-body --silent --show-error --max-time 15 \
              -H 'content-type: application/json' \
              -H "Authorization: Bearer ${CROWDRELAY_COMMERCE_API_KEY}" \
              --data-binary @- "${CROWDRELAY_BASE_URL%/}/v1/internal/autopilot/release-components"
          echo "VIRYA_SIGNAL_RELEASE_LEDGER=PASS sha=${GITHUB_SHA} version=${COMPONENT_VERSION}"
