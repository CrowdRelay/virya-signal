[package]
name = "virya-mobile-ui"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Virya mobile operator and fan application UI"
license = "Apache-2.0"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[workspace]
members = ["src-tauri"]
resolver = "2"
