[package]
name = "virya-signal-ui"
version = "0.5.1"
edition = "2024"
rust-version = "1.97"
description = "Virya Signal mobile operator and fan application UI"
license = "Apache-2.0"

[dependencies]
virya-signal-contracts = { path = "crates/virya-signal-contracts" }
js-sys = "0.3"
leptos = { version = "0.8.20", default-features = false, features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Pull-to-refresh reads the touch list off the content column's touch events,
# and `Element` so its top check can ask that column for its own `scrollTop`.
# Leptos enables `Element` as well, but relying on another crate's feature set
# is how a build breaks on an unrelated bump.
web-sys = { version = "0.3", features = ["Element", "Touch", "TouchList"] }
# This was declared under `[target.'cfg(debug_assertions)'.dependencies]`, which
# Cargo does not support — it resolves `cfg()` against the target platform, so
# `debug_assertions` never matches. Cargo warned about the section on every
# build and `cargo tree` showed the crate in the release graph anyway, so it
# bought nothing it claimed to. It cannot be a dev-dependency either: those are
# invisible to the binary, and the call lives in `main.rs`.
# What actually keeps the panic formatter out of the size-critical WASM is the
# `#[cfg(debug_assertions)]` on that call — a real compile-time cfg. With no
# reachable caller, release LTO drops the crate.
console_error_panic_hook = "0.1.7"

[workspace]
members = ["crates/virya-signal-contracts", "src-tauri"]
resolver = "2"

[profile.dev]
debug = 0
incremental = true
opt-level = 1
panic = "abort"
strip = "symbols"

# Password derivation is intentionally expensive. Optimizing it in debug builds
# keeps local/mobile unlock latency representative without optimizing the app.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
# Whole-program LTO in one codegen unit. Cross-crate inlining and dead-code
# elimination across the Leptos/wasm-bindgen boundary is what actually shrinks
# this binary: the size is diffuse across ~8.6k items, not one fat dependency.
# Measured on 0.4.2: 2,003,240 -> 1,779,524 bytes of wasm (-11.2%).
# Spelled `true` rather than "fat": they are the same setting to Cargo, and
# the release-profile contract accepts true/"thin" but not the "fat" string.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

# WebAssembly is download/startup sensitive; the native shell remains opt=s.
# opt-level "z" is deliberate and measured: "s" produced a *larger* binary
# (2,253,787 bytes) and worse blocking time, because the extra inlining costs
# more in module size than it recovers in execution speed.
[profile.release.package.virya-signal-ui]
opt-level = "z"
codegen-units = 1
